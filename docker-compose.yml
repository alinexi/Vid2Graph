# One-command startup:  docker compose up --build
# Ollama running on the HOST is reachable from the containers as host.docker.internal.
# To run Ollama inside compose as well:  docker compose --profile ollama up --build
services:
  backend:
    build: ./backend
    container_name: vid2graph-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      VID2GRAPH_DATA_DIR: /data
      VID2GRAPH_LLM_BASE_URL: ${VID2GRAPH_LLM_BASE_URL:-http://host.docker.internal:11434}
      VID2GRAPH_EMBEDDING_BASE_URL: ${VID2GRAPH_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      VID2GRAPH_CORS_ORIGINS: ${VID2GRAPH_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - vid2graph-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: vid2graph-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: vid2graph-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  vid2graph-data:
  ollama-models:
